
<!-- FreshSupply Customer Authentication -->
<section id="fs-auth" style="max-width:420px;margin:30px auto;padding:22px;border:1px solid #ddd;border-radius:16px;font-family:Arial,sans-serif;background:#fff;color:#222">
  <h2 style="color:#218838;margin-top:0">FreshSupply Account</h2>
  <p>Sign in or create an account to order fresh vegetables.</p>

  <label for="fs-email">Email address</label>
  <input id="fs-email" type="email" autocomplete="email"
    placeholder="you@example.com" required
    style="display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px">

  <label for="fs-password">Password</label>
  <input id="fs-password" type="password"
    autocomplete="current-password" minlength="6"
    placeholder="At least 6 characters" required
    style="display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px">

  <button id="fs-signup" type="button"
    style="width:100%;padding:12px;background:#218838;color:white;border:0;border-radius:8px;margin-bottom:10px">
    Create Account
  </button>

  <button id="fs-signin" type="button"
    style="width:100%;padding:12px;background:#fff;color:#218838;border:1px solid #218838;border-radius:8px">
    Sign In
  </button>

  <p id="fs-message" role="status" aria-live="polite"></p>
  <div id="fs-account" hidden>
    <p id="fs-user"></p>
    <button id="fs-signout" type="button">Sign Out</button>
  </div>
</section>

<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // Use your EXISTING Supabase project URL and publishable key.
  const SUPABASE_URL = "PASTE_YOUR_EXISTING_PROJECT_URL";
  const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY";

  const message = document.getElementById("fs-message");
  const emailInput = document.getElementById("fs-email");
  const passwordInput = document.getElementById("fs-password");
  const account = document.getElementById("fs-account");
  const userText = document.getElementById("fs-user");

  if (!window.supabase ||
      SUPABASE_URL.startsWith("PASTE_") ||
      SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_")) {
    message.textContent = "Setup incomplete: add your existing Supabase URL and publishable key.";
    return;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
  );

  function showMessage(text) {
    message.textContent = text;
  }

  function getCredentials() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password || password.length < 6) {
      showMessage("Enter a valid email and a password of at least 6 characters.");
      return null;
    }
    return { email, password };
  }

  document.getElementById("fs-signup").addEventListener("click", async () => {
    const credentials = getCredentials();
    if (!credentials) return;

    showMessage("Creating your account...");
    const { data, error } = await client.auth.signUp({
      ...credentials,
      options: {
        emailRedirectTo: window.location.href.split("#")[0]
      }
    });

    if (error) {
      showMessage(error.message);
    } else if (data.session) {
      showMessage("Account created successfully.");
    } else {
      showMessage("Check your email for the confirmation link, then sign in.");
    }
  });

  document.getElementById("fs-signin").addEventListener("click", async () => {
    const credentials = getCredentials();
    if (!credentials) return;

    showMessage("Signing in...");
    const { error } = await client.auth.signInWithPassword(credentials);

    if (error) {
      showMessage(error.message);
    } else {
      showMessage("Signed in successfully.");
    }
  });

  document.getElementById("fs-signout").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    showMessage(error ? error.message : "You have signed out.");
  });

  client.auth.onAuthStateChange((_event, session) => {
    account.hidden = !session;
    if (session) {
      userText.textContent = "Signed in as " + session.user.email;
    }
  });

  client.auth.getSession().then(({ data, error }) => {
    if (error) showMessage(error.message);
    else {
      account.hidden = !data.session;
      if (data.session) {
        userText.textContent = "Signed in as " + data.session.user.email;
      }
    }
  });
})();
</script>
